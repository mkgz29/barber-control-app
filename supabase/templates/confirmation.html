<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f5f5f4;font-family:Arial,sans-serif;color:#1c1917;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;border:1px solid #e7e5e4;">
      <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#a16207;">
        Agenda Barber
      </p>
      <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;">Confirmá tu cuenta</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.7;">
        Recibimos un registro para <strong>{{ .Email }}</strong>. Confirmá el email para activar la cuenta.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:700;">
          Confirmar email
        </a>
      </p>
      <p style="margin:0;font-size:14px;line-height:1.7;color:#57534e;">
        Si no fuiste vos, ignorá este mensaje. No respondas a este correo.
      </p>
    </div>
  </body>
</html>
